allowBuilds:
  '@parcel/watcher': true
  '@prisma/client': true
  '@prisma/engines': true
  '@swc/core': true
  esbuild: true
  prisma: true
  sharp: false
  unrs-resolver: false

overrides:
  # prisma@7.10.0 pins mysql2 3.15.3 (used only by Prisma Studio for MySQL,
  # never by this Postgres app), which has a high CVE. Same major, patched.
  # Remove when a prisma release ships a fixed mysql2.
  mysql2: ^3.24.4
